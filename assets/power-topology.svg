<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7f"/>
    </marker>
    <style>
      .t{fill:#101820}
      .sub{fill:#5b6b7f}
      .box{fill:#f7fafc;stroke:#cfd8e3;stroke-width:2}
      .lab{fill:#33445a}
      .wire{stroke:#5b6b7f;stroke-width:2.4;fill:none}
      .warn{fill:#b3261e}
    </style>
  </defs>

  <rect width="1240" height="620" fill="#ffffff"/>
  <text class="t" x="40" y="52" font-size="27" font-weight="700">Питание: 12 В-блок + Pico на 24-pin</text>
  <text class="sub" x="40" y="82" font-size="15">Майнинговый БП даёт только 12 В — 24-pin собирает Pico</text>

  <!-- mains -->
  <rect class="box" x="40" y="290" width="130" height="90" rx="12"/>
  <text class="t" x="105" y="328" font-size="17" font-weight="600" text-anchor="middle">220 В</text>
  <text class="sub" x="105" y="352" font-size="13" text-anchor="middle">16 А · линия</text>

  <!-- PSU -->
  <rect class="box" x="220" y="262" width="210" height="146" rx="14" stroke="#76b900" stroke-width="2.5"/>
  <text class="t" x="325" y="296" font-size="17" font-weight="700" text-anchor="middle">БП 12 В · 166 А</text>
  <text class="sub" x="325" y="320" font-size="13" text-anchor="middle">«2000 Вт» · 10× 6+2</text>
  <text class="sub" x="325" y="342" font-size="13" text-anchor="middle">80+ Platinum — наклейка</text>
  <text class="warn" x="325" y="368" font-size="13" text-anchor="middle">PS_ON нет: 12 В всегда</text>
  <text class="sub" x="325" y="390" font-size="12" text-anchor="middle">→ мастер-выключатель</text>

  <line class="wire" x1="170" y1="335" x2="216" y2="335" marker-end="url(#ar)"/>

  <!-- 12V bus -->
  <line class="wire" x1="430" y1="335" x2="520" y2="335"/>
  <line class="wire" x1="520" y1="90" x2="520" y2="520" stroke-width="4" stroke="#76b900"/>

  <!-- Pico -->
  <rect class="box" x="620" y="48" width="190" height="84" rx="12"/>
  <text class="t" x="715" y="80" font-size="16" font-weight="600" text-anchor="middle">Pico 160 Вт</text>
  <text class="sub" x="715" y="102" font-size="13" text-anchor="middle">DC 12 В → ATX</text>
  <text class="sub" x="715" y="120" font-size="12" text-anchor="middle">+3.3 / +5 / +12</text>
  <line class="wire" x1="520" y1="90" x2="616" y2="90" marker-end="url(#ar)"/>
  <text class="lab" x="568" y="78" font-size="12" text-anchor="middle">12 В</text>

  <!-- board -->
  <rect class="box" x="880" y="48" width="300" height="84" rx="12"/>
  <text class="t" x="1030" y="80" font-size="16" font-weight="600" text-anchor="middle">Плата ZX-DU99D4</text>
  <text class="sub" x="1030" y="102" font-size="13" text-anchor="middle">24-pin: чипсет, слот x16, NVMe</text>
  <text class="sub" x="1030" y="120" font-size="12" text-anchor="middle">потолок Pico — 160 Вт</text>
  <line class="wire" x1="810" y1="90" x2="876" y2="90" marker-end="url(#ar)"/>
  <text class="lab" x="843" y="78" font-size="12" text-anchor="middle">24-pin</text>

  <!-- CPUs -->
  <rect class="box" x="620" y="196" width="190" height="84" rx="12"/>
  <text class="t" x="715" y="228" font-size="16" font-weight="600" text-anchor="middle">2× Xeon</text>
  <text class="sub" x="715" y="250" font-size="13" text-anchor="middle">E5-2695 v4</text>
  <text class="sub" x="715" y="268" font-size="12" text-anchor="middle">2× ~150 Вт</text>
  <line class="wire" x1="520" y1="238" x2="616" y2="238" marker-end="url(#ar)"/>
  <text class="lab" x="568" y="226" font-size="12" text-anchor="middle">EPS 8-pin</text>

  <rect class="box" x="880" y="196" width="300" height="84" rx="12"/>
  <text class="t" x="1030" y="228" font-size="16" font-weight="600" text-anchor="middle">2× EPS 8-pin</text>
  <text class="sub" x="1030" y="250" font-size="13" text-anchor="middle">через переходник 6+2 → EPS</text>
  <text class="sub" x="1030" y="268" font-size="12" text-anchor="middle">14 А на кабель — норма</text>
  <line class="wire" x1="810" y1="238" x2="876" y2="238" marker-end="url(#ar)"/>
  <text class="lab" x="843" y="226" font-size="12" text-anchor="middle">×2</text>

  <!-- GPU module -->
  <rect class="box" x="620" y="352" width="190" height="106" rx="12" stroke="#76b900" stroke-width="2.5"/>
  <text class="t" x="715" y="386" font-size="16" font-weight="700" text-anchor="middle">Модуль 4×V100</text>
  <text class="sub" x="715" y="408" font-size="13" text-anchor="middle">SXM2 · NVLink</text>
  <text class="sub" x="715" y="430" font-size="12" text-anchor="middle">2× 8-pin, до 1200 Вт</text>
  <line class="wire" x1="520" y1="405" x2="616" y2="405" marker-end="url(#ar)" stroke="#76b900"/>
  <text class="lab" x="568" y="393" font-size="12" text-anchor="middle">2× 8-pin</text>

  <rect class="box" x="880" y="352" width="300" height="106" rx="12" stroke="#b3261e" stroke-width="2"/>
  <text class="t" x="1030" y="384" font-size="15" font-weight="600" text-anchor="middle">На каждый вход — ДВА 6+2</text>
  <text class="sub" x="1030" y="408" font-size="13" text-anchor="middle">1200 Вт = 50 А на вход</text>
  <text class="warn" x="1030" y="430" font-size="13" text-anchor="middle">16 А на провод 18 AWG — плавится</text>
  <line class="wire" x1="810" y1="405" x2="876" y2="405" marker-end="url(#ar)" stroke="#b3261e"/>

  <!-- notes -->
  <rect x="40" y="470" width="560" height="112" rx="12" fill="#f3f8ea" stroke="#cfe3b0"/>
  <text class="t" x="62" y="500" font-size="15" font-weight="600">Бюджет мощности</text>
  <text class="sub" x="62" y="524" font-size="13">простой ~250 Вт · инференс 900–1100 Вт · пуск модели до 1400 Вт</text>
  <text class="sub" x="62" y="546" font-size="13">с лимитом nvidia-smi -pl 250 — 1000 Вт вместо 1200, скорость почти та же</text>
  <text class="sub" x="62" y="568" font-size="13">второй Pico — запас: два Pico на один 24-pin не параллелятся</text>

  <rect x="620" y="470" width="560" height="112" rx="12" fill="#fdf1ef" stroke="#f2c8c2"/>
  <text class="t" x="642" y="500" font-size="15" font-weight="600">Три вещи, которые нельзя пропустить</text>
  <text class="sub" x="642" y="524" font-size="13">1. бочонок 5.5×2.5 на Pico (5–10 А) → заменить на XT60 или пайку</text>
  <text class="sub" x="642" y="546" font-size="13">2. мастер-выключатель: 12 В живёт всегда, модуль ест ~150 Вт в простое</text>
  <text class="sub" x="642" y="568" font-size="13">3. лимит 250 Вт/карту — иначе упрёмся в потолок блока и в тепло</text>
</svg>
